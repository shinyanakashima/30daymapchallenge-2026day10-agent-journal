<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Rewind · 30DayMapChallenge 2026 Day 10</title>
  <meta name="description" content="Replay of an AI map-making session: prompts, responses and the screen at each step.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app" class="app" data-state="loading">
   <div class="screen">
    <header class="top">
      <div class="heading">
        <p class="kicker"><span class="brand">Map Rewind</span> <span class="tag">#30DayMapChallenge 2026 · Day 10: Prompting only</span></p>
        <h1 class="title" id="title">Map Rewind</h1>
      </div>
      <div class="top-tools">
        <div class="views" id="views" role="group" aria-label="View">
          <button id="view-screen" type="button" aria-pressed="true">Screen</button>
          <button id="view-layers" type="button" aria-pressed="false">Layers</button>
        </div>
        <button id="lang" class="lang" type="button"><span data-l="en" lang="en">EN</span> / <span data-l="ja" lang="ja">日本語</span></button>
      </div>
    </header>
    <p id="fixture" class="fixture" hidden></p>
    <p id="local-note" class="local-note" hidden></p>

    <main class="stage-wrap">
      <figure class="stage" id="stage" data-state="loading" aria-live="polite">
        <canvas id="frame" width="1200" height="900" role="img" aria-label=""></canvas>
        <div class="stage-msg" id="stage-msg"></div>
        <figcaption class="stage-cap"><span id="stage-cap"></span><span class="view-hint" id="view-hint"></span></figcaption>
      </figure>
    </main>

    <aside class="side" id="side" aria-labelledby="side-h">
      <h2 id="side-h" class="side-h">Conversation up to this step</h2>
      <ol class="log" id="log"></ol>
    </aside>

    <nav class="controls" id="controls" aria-label="Timeline">
      <div class="buttons">
        <button id="prev" type="button" aria-label="Previous step">◀</button>
        <button id="play" type="button" aria-pressed="false" aria-label="Play">▶</button>
        <button id="next" type="button" aria-label="Next step">▶︎▶︎</button>
        <span class="counter" id="counter">–</span>
      </div>
      <div class="track">
        <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Timeline">
        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>
    </nav>
   </div>

    <footer class="foot" id="foot"></footer>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
